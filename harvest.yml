name: Agent_Trader Harvest

on:
  # PRIMARY: Daily Mon-Fri at midnight IST = 18:30 UTC
  # Both Stooq and yfinance work reliably at this time (post-market, low traffic)
  schedule:
    - cron: "30 18 * * 1-5"

  # SECONDARY: Early morning IST = 01:30 UTC (pre-market backup)
  # If midnight run failed, this catches it before market open
  # schedule:
  #   - cron: "30 1 * * 2-6"   # uncomment if you want a second attempt

  # Triggered when Streamlit writes holdings_trigger.enc (user uploads Excel)
  # NOTE: This fires the harvest immediately. If it's market hours and data
  # sources are blocked, the harvest will preserve existing snapshot data
  # (BUG_13 fix) and the new stocks will be picked up at the next midnight run.
  push:
    branches:
      - master
    paths:
      - "db/holdings_trigger.enc"

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      mode:
        description: "Harvest mode"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - full

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run harvest
        env:
          FERNET_KEY:    ${{ secrets.FERNET_KEY }}
          GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:   SubhasishSahu/Avito
          GITHUB_BRANCH: master
          HARVEST_MODE:  ${{ github.event.inputs.mode || 'auto' }}
        run: |
          cd $GITHUB_WORKSPACE
          python harvest_runner.py

      - name: Confirm db files written
        run: |
          echo "=== db/ folder contents ==="
          ls -lh db/ || echo "db/ folder empty or missing"
          echo "=== Last 5 commits ==="
          git log --oneline -5
